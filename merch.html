  <!-- ══════════════════════════════════════
       MERCH GRID

       HOW TO ADD A PHOTO FOR AN ITEM:
       1. Save your product photo to images/merch/
          (suggested names are shown in each placeholder below)
       2. Find the item's <div class="merch-img-wrap"> block.
       3. Delete the <div class="merch-placeholder"> inside it.
       4. Replace it with: <img src="images/merch/filename.jpg" alt="Product name">
          (square photos work best — same width and height)

       HOW TO ADD THE STORE LINK FOR AN ITEM:
       Find the <a href="#" ... class="merch-card"> for that item and
       replace the # with your store link (e.g. from Printful, Redbubble, Shopify, etc.)
       All links open in a new tab automatically.

       HOW TO UPDATE PRICES:
       Find <p class="merch-price"> for each item and change the text.

       HOW TO ADD A NEW ITEM:
       Copy any full <a class="merch-card"> block and paste it into the grid.
       Update the href, image, name, and price.
  ══════════════════════════════════════ -->
  <section class="section" style="text-align:center; padding-top: 3rem; padding-bottom: 5rem;">
    <p style="font-family:var(--serif); font-size:clamp(1rem,2.5vw,1.3rem); color:var(--text-muted); margin-bottom: 2.5rem;">
      To purchase merch, visit my store — hosted by Fourthwall.
    </p>
    <a href="https://sofia-ssc-shop.fourthwall.com/en-gbp"
       target="_blank" rel="noopener noreferrer"
       class="btn btn-outline"
       style="font-size:1.1rem; padding: 1rem 2.5rem;">
      Visit my merch store →
    </a>
  </section>
