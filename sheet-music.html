  <!-- ══════════════════════════════════════
       SHEET MUSIC CARDS

       HOW TO ADD A COVER IMAGE:
       1. Save your book/cover image to images/sheet-music/
          (suggested filenames are shown in each placeholder below)
       2. Delete the <div class="sheet-img-placeholder"> inside that card's <div class="sheet-img">.
       3. Replace it with: <img src="images/sheet-music/your-file.jpg" alt="Cover description">

       HOW TO UPDATE BUY LINKS:
       Find the <a href="#" ... class="btn btn-outline"> button for each card
       and replace # with your store link.

       HOW TO ADD MORE COLLECTIONS:
       Copy a full <div class="sheet-card"> block and paste it into the grid.
  ══════════════════════════════════════ -->
